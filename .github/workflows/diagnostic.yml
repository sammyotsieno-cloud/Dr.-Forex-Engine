name: Self Diagnostic

on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    name: Analyze Build Evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout current branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Download diagnostics from triggering run
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p diagnostics
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name dr-forex-engine-diagnostics \
            --dir diagnostics

      - name: Prepare manual diagnostic evidence
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p diagnostics
          printf '%s\n' 'Manual diagnostic run; no triggering build artifact was supplied.' > diagnostics/environment.txt

      - name: Run self-diagnostic engine
        run: |
          python -m app.jobs.run_diagnostics diagnostics --repository . | tee diagnostic-report.json

      - name: Publish diagnostic summary
        if: always()
        run: |
          echo "## Self Diagnostic Report" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat diagnostic-report.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-forex-engine-self-diagnostic
          path: diagnostic-report.json
          if-no-files-found: warn
          retention-days: 30
